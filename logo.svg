<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Orbital Wallet" role="img">
  <!-- Outer orbit ring -->
  <circle cx="50" cy="50" r="44" stroke="#00d4ff" stroke-width="4" opacity="0.4"/>
  <!-- Inner orbit ring -->
  <circle cx="50" cy="50" r="30" stroke="#00d4ff" stroke-width="3" opacity="0.6"/>
  <!-- Centre nucleus -->
  <circle cx="50" cy="50" r="12" fill="#00d4ff"/>
  <!-- Orbiting dot — top -->
  <circle cx="50" cy="6" r="5" fill="#00d4ff"/>
  <!-- Orbiting dot — right -->
  <circle cx="94" cy="50" r="5" fill="#00d4ff" opacity="0.7"/>
  <!-- Orbiting dot — bottom-left -->
  <circle cx="18" cy="82" r="5" fill="#00d4ff" opacity="0.5"/>
  <!-- Cross-hair lines (subtle) -->
  <line x1="50" y1="20" x2="50" y2="80" stroke="#00d4ff" stroke-width="1.5" opacity="0.2"/>
  <line x1="20" y1="50" x2="80" y2="50" stroke="#00d4ff" stroke-width="1.5" opacity="0.2"/>
</svg>
